aid: arena-club
name: Arena Club
description: 'Arena Club is a technology-first trading-card and collectibles platform
  founded in 2022 by entrepreneur Brian Lee and baseball Hall-of-Famer Derek Jeter,
  operating as Arenaclub.com, Inc. The company combines AI- and computer-vision-assisted
  card grading, an insured physical vault with 24/7 surveillance and climate control,
  a digital "Showroom" where collectors organize vaulted cards into collections, and
  an online marketplace for buying, selling and trading slabbed sports and trading-card-game
  cards. Members submit cards for grading and vaulting, browse and transact in the
  marketplace, open digital packs, and can retrieve physical cards from the vault on
  demand. Arena Club ships web and native iOS/Android apps but publishes no public
  developer program, API documentation, or machine-readable API contract.'
